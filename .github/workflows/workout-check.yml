name: Workout regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run check:workout
